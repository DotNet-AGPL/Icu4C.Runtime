name: Build

on:
  # Release: pushing a v* tag builds all RIDs and packs the packages (artifacts only; no auto-publish).
  push:
    tags: ['v*']
  # Validation: PRs touching build-relevant files run the full matrix.
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'buildTransitive/**'
      - 'build-slim/**'
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the packed NuGet packages to nuget.org (manual)'
        type: boolean
        default: false

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            kind: linux-glibc
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            kind: linux-glibc
          - rid: linux-musl-x64
            os: ubuntu-24.04
            kind: linux-musl
            container: alpine:3.20
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
            kind: linux-musl
            container: alpine:3.20
          - rid: win-x64
            os: windows-2022
            kind: win
          - rid: win-arm64
            os: windows-2022
            kind: win
          - rid: osx-x64
            os: macos-15-intel
            kind: osx
          - rid: osx-arm64
            os: macos-14
            kind: osx

    runs-on: ${{ matrix.os }}
    env:
      # GitHub-hosted runners reach github.com directly; no download proxy needed.
      ICU_GH_PROXY: "-"
      # Cache the ICU source tarball between runs (see the Cache step).
      ICU_CACHE_DIR: ${{ github.workspace }}/.icu-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache ICU source
        uses: actions/cache@v4
        with:
          path: .icu-cache
          key: icu-src-${{ runner.os }}-77.1

      - name: Build ICU (Linux, glibc)
        if: matrix.kind == 'linux-glibc'
        run: |
          # Build on an older glibc baseline (AlmaLinux 8 / glibc 2.28) with a modern
          # toolchain (gcc-toolset-13) so the libraries load on Debian 11+, Ubuntu 20.04+,
          # RHEL/Alma/Rocky 8-9, Amazon Linux 2, Debian 12, etc. Building on ubuntu-24.04
          # (glibc 2.39) leaked a GLIBC_2.38 requirement that breaks older targets.
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            -e ICU_GH_PROXY=- -e ICU_CACHE_DIR=/work/.icu-cache \
            almalinux:8 bash -c "
              set -e
              dnf install -y gcc-toolset-13-gcc-c++ make curl
              if ! dnf install -y patchelf; then
                if dnf install -y epel-release && dnf install -y patchelf; then :; else
                  dnf install -y python3-pip && pip3 install patchelf
                fi
              fi
              command -v patchelf
              source /opt/rh/gcc-toolset-13/enable
              gcc --version | head -1
              bash ./scripts/build-icu-linux.sh 77.1 ${{ matrix.rid }}
            "

      - name: Build ICU (Linux, musl)
        if: matrix.kind == 'linux-musl'
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            -e ICU_GH_PROXY=- -e ICU_CACHE_DIR=/work/.icu-cache \
            ${{ matrix.container }} sh -c "
              apk add --no-cache build-base curl python3 bash linux-headers patchelf &&
              bash ./scripts/build-icu-linux.sh 77.1 ${{ matrix.rid }}
            "

      - name: Build ICU (Windows)
        if: matrix.kind == 'win'
        shell: pwsh
        run: ./scripts/build-icu-windows.ps1 77.1 ${{ matrix.rid }}

      - name: Build ICU (macOS)
        if: matrix.kind == 'osx'
        run: bash ./scripts/build-icu-macos.sh 77.1 ${{ matrix.rid }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Platform package (natives + build/) uploaded per RID.
      - name: Pack platform package (Icu4C.Runtime.${{ matrix.rid }})
        run: dotnet pack src/Icu4C.Runtime.Slim/Icu4C.Runtime.Slim.csproj -c Release -o nupkg -p:IcuRid=${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.rid }}
          path: nupkg/*.nupkg

  pack:
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: platform-pkgs
          pattern: pkg-*
          merge-multiple: true

      - name: Pack meta package (Icu4C.Runtime)
        run: |
          dotnet restore src/Icu4C.Runtime/Icu4C.Runtime.csproj -s "$PWD/platform-pkgs"
          dotnet pack src/Icu4C.Runtime/Icu4C.Runtime.csproj -c Release -o nupkg --no-restore

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-core
          path: nupkg/*.nupkg

      - name: Collect all packages for publishing
        run: cp platform-pkgs/*.nupkg nupkg/ && ls -l nupkg

      # NuGet publishing is manual: it only runs on a manual workflow_dispatch
      # with the "publish" input enabled, and requires the NUGET_API_KEY secret.
      - name: Publish to NuGet (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY is not set; cannot publish."
            exit 1
          fi
          dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  # Regression guard for the Linux packaging fixes (glibc floor, no C++ runtime deps, exact
  # inter-library NEEDED + $ORIGIN, musl loading) plus a JIT/AOT smoke test.
  verify-linux:
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: nupkg
          pattern: 'pkg-*'
          merge-multiple: true
      - name: Download meta package
        uses: actions/download-artifact@v4
        with:
          name: nupkg-core
          path: nupkg
      - name: Verify Linux packages (static + JIT + AOT)
        run: bash scripts/verify-linux.sh
