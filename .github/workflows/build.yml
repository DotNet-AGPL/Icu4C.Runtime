name: Build

on:
  # Release: pushing a v* tag builds all RIDs, packs, and (if NUGET_API_KEY is set) publishes.
  push:
    tags: ['v*']
  # Validation: PRs touching build-relevant files run the full matrix.
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'build/**'
      - 'buildTransitive/**'
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            kind: linux-glibc
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            kind: linux-glibc
          - rid: linux-musl-x64
            os: ubuntu-24.04
            kind: linux-musl
            container: alpine:3.20
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
            kind: linux-musl
            container: alpine:3.20
          - rid: win-x64
            os: windows-2022
            kind: win
          - rid: win-arm64
            os: windows-2022
            kind: win
          - rid: osx-x64
            os: macos-15-intel
            kind: osx
          - rid: osx-arm64
            os: macos-14
            kind: osx

    runs-on: ${{ matrix.os }}
    env:
      # GitHub-hosted runners reach github.com directly; no download proxy needed.
      ICU_GH_PROXY: "-"
      # Cache the ICU source tarball between runs (see the Cache step).
      ICU_CACHE_DIR: ${{ github.workspace }}/.icu-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache ICU source
        uses: actions/cache@v4
        with:
          path: .icu-cache
          key: icu-src-${{ runner.os }}-77.1

      - name: Build ICU (Linux, glibc)
        if: matrix.kind == 'linux-glibc'
        run: bash ./scripts/build-icu-linux.sh 77.1 ${{ matrix.rid }}

      - name: Build ICU (Linux, musl)
        if: matrix.kind == 'linux-musl'
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            -e ICU_GH_PROXY=- -e ICU_CACHE_DIR=/work/.icu-cache \
            ${{ matrix.container }} sh -c "
              apk add --no-cache build-base curl python3 bash linux-headers &&
              bash ./scripts/build-icu-linux.sh 77.1 ${{ matrix.rid }}
            "

      - name: Build ICU (Windows)
        if: matrix.kind == 'win'
        shell: pwsh
        run: ./scripts/build-icu-windows.ps1 77.1 ${{ matrix.rid }}

      - name: Build ICU (macOS)
        if: matrix.kind == 'osx'
        run: bash ./scripts/build-icu-macos.sh 77.1 ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/

  pack:
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: runtimes
          pattern: native-*

      - name: Restructure artifacts
        run: |
          for dir in runtimes/native-*; do
            rid="${dir#runtimes/native-}"
            mkdir -p "runtimes/${rid}/native"
            mv "${dir}"/* "runtimes/${rid}/native/"
            rmdir "${dir}"
          done
          find runtimes -type f | sort

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/Icu4C.Runtime/Icu4C.Runtime.csproj -c Release -o nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY not set; skipping NuGet push."
            exit 0
          fi
          dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
